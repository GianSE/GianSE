name: Snake Game

# Quando gerar a cobrinha
on:
  schedule:
    # A cada 6 horas
    - cron: "0 */6 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # Regenera sempre que houver push na branch principal
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Gera os SVGs (versão clara e escura) e o GIF da cobrinha
      - name: Gerar snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif

      # Publica os arquivos gerados na branch output
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
